    <rect x="54" y="176" width="152" height="218" rx="8" fill="#ffffff" stroke="#1b6f73" stroke-width="4"/>
    <rect x="78" y="211" width="104" height="74" rx="5" fill="#d8eeea"/>
    <circle cx="98" cy="310" r="8" fill="#47a585"/><circle cx="124" cy="310" r="8" fill="#e4a743"/>
    <path d="M81 345H179M81 366H158" stroke="#6c8588" stroke-width="10" stroke-linecap="round"/>
    <text x="130" y="427" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="24" font-weight="700">上位系統</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="267" y="209" width="146" height="165" rx="8" fill="#fff4dc" stroke="#b86217" stroke-width="4"/>
    <rect x="292" y="184" width="96" height="50" rx="6" fill="#ffffff" stroke="#b86217" stroke-width="3"/>
