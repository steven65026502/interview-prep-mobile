  <text x="600" y="555" text-anchor="middle" fill="#8bd8cc" font-family="Consolas,monospace" font-size="21">TASK-20260903-0842</text>
  <text x="600" y="585" text-anchor="middle" fill="#ffffff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22">送單 08:42:01　排程 08:42:02　設備接收 08:42:03　完成 08:42:11</text>
