    <rect x="292" y="312" width="96" height="50" rx="6" fill="#ffffff" stroke="#b86217" stroke-width="3"/>
    <text x="340" y="427" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="24" font-weight="700">任務佇列</text>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="516" cy="210" rx="77" ry="30" fill="#dcebf5" stroke="#28658d" stroke-width="4"/>
    <path d="M439 210V346C439 363 474 377 516 377C558 377 593 363 593 346V210" fill="#e9f3f9" stroke="#28658d" stroke-width="4"/>
    <ellipse cx="516" cy="346" rx="77" ry="30" fill="#dcebf5" stroke="#28658d" stroke-width="4"/>
    <text x="516" y="427" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="24" font-weight="700">狀態資料庫</text>
  </g>
