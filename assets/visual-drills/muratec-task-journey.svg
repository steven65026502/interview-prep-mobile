<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">一筆搬送任務的完整旅程</title>
  <desc id="desc">上位系統建立任務後，經過任務佇列、資料庫、網路、設備控制與現場人員，各階段以同一任務編號串接。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1b6f73"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17343b" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <path d="M0 470H1200V675H0Z" fill="#dbe8e3"/>
  <path d="M0 570H1200" stroke="#b9ccc5" stroke-width="5" stroke-dasharray="24 16"/>
  <text x="62" y="72" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">一筆搬送任務，必須能從頭追到尾</text>
  <text x="64" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">同一個 Task ID ＋ 每一段時間戳，才找得到延遲真正發生的位置</text>

