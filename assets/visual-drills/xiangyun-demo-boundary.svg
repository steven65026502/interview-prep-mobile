<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">公開 Demo 與本機完整系統的邊界</title>
  <desc id="desc">公開版像展示間，提供固定文件、可重現檢索與治理流程；本機版像引擎室，另有 FastAPI、Ollama、向量模型與完整混合檢索。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">公開版是展示間；本機版才有完整引擎室</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">主動說清楚邊界，比把 Demo 講成已上線產品更可信</text>

  <g transform="translate(55 158)" filter="url(#s)">
    <rect width="510" height="404" rx="12" fill="#fff" stroke="#28658d" stroke-width="4"/>
    <path d="M40 92H470V326H40Z" fill="#e2eef6" stroke="#28658d" stroke-width="4"/>
    <path d="M73 122H437V215H73Z" fill="#fff" stroke="#8db4ca" stroke-width="3"/>
    <path d="M91 149H288M91 180H331" stroke="#28658d" stroke-width="8" stroke-linecap="round"/>
    <rect x="73" y="238" width="166" height="58" rx="7" fill="#dceee9"/><text x="156" y="274" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="20" font-weight="700">固定公開文件</text>
    <rect x="271" y="238" width="166" height="58" rx="7" fill="#fff0d7"/><text x="354" y="274" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="20" font-weight="700">可重現檢索</text>
    <text x="255" y="51" text-anchor="middle" fill="#28658d" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="28" font-weight="700">公開展示間</text>
    <text x="255" y="365" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="21">無病人資料 · 無院內連線 · 可供面試操作</text>
  </g>
  <g transform="translate(635 158)" filter="url(#s)">
    <rect width="510" height="404" rx="12" fill="#153d47" stroke="#1b6f73" stroke-width="4"/>
    <text x="255" y="51" text-anchor="middle" fill="#8bd8cc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="28" font-weight="700">本機引擎室</text>
    <g font-family="Consolas,monospace" font-size="20" text-anchor="middle">
      <rect x="38" y="94" width="190" height="72" rx="8" fill="#e2eef6"/><text x="133" y="137" fill="#153d47">FastAPI</text>
      <rect x="282" y="94" width="190" height="72" rx="8" fill="#dceee9"/><text x="377" y="137" fill="#153d47">Ollama / LLM</text>
      <rect x="38" y="211" width="190" height="72" rx="8" fill="#fff0d7"/><text x="133" y="254" fill="#153d47">BM25 + BGE</text>
      <rect x="282" y="211" width="190" height="72" rx="8" fill="#e2efe5"/><text x="377" y="254" fill="#153d47">RRF + rerank</text>
    </g>
    <path d="M229 130H276M133 168V204M377 168V204M229 247H276" stroke="#8bd8cc" stroke-width="7" marker-end="url(#a)"/>
    <text x="255" y="340" text-anchor="middle" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="21">完整模型推論、混合檢索與 API 路徑</text>
    <text x="255" y="373" text-anchor="middle" fill="#cfe5df" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="19">公開網址不等於這些元件已部署在網路上</text>
  </g>
  <path d="M578 360H621" stroke="#9a4138" stroke-width="9" stroke-dasharray="12 10"/>
</svg>
