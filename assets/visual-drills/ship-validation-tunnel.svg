<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">電子海圖或格網資料的六道檢查門</title>
  <desc id="desc">資料檔先確認產品規格與版本，再依序通過座標範圍、圖徵格網、時間基準、已知點與全批資料驗證。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">畫面能顯示，不代表資料真的正確</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">先讓小樣本通過六道檢查門，再跑全批資料</text>
  <path d="M100 478H1100" stroke="#b9ccc5" stroke-width="16" stroke-linecap="round"/>
  <g transform="translate(65 184)" filter="url(#s)">
    <path d="M0 18L28 0H176L204 18V214H0Z" fill="#fff" stroke="#153d47" stroke-width="4"/>
    <path d="M28 0V61H176V0" fill="#e2eef6" stroke="#28658d" stroke-width="4"/>
    <path d="M30 93H174M30 129H174M30 165H141" stroke="#7794a2" stroke-width="9" stroke-linecap="round"/>
    <text x="102" y="255" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23" font-weight="700">待檢資料</text>
  </g>
  <path d="M274 294H316" stroke="#28658d" stroke-width="7" marker-end="url(#a)"/>
  <g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(329 162)"><rect width="135" height="278" rx="10" fill="#fff" stroke="#1b6f73" stroke-width="4"/><circle cx="68" cy="66" r="36" fill="#dceee9"/><text x="68" y="76" fill="#1b6f73" font-size="31" font-weight="700">1</text><text x="68" y="137" fill="#153d47" font-size="22" font-weight="700">規格版本</text><text x="68" y="174" fill="#597078" font-size="17">產品身分</text><path d="M36 218L58 241L100 195" fill="none" stroke="#37764c" stroke-width="9" stroke-linecap="round"/></g>
    <g transform="translate(482 162)"><rect width="135" height="278" rx="10" fill="#fff" stroke="#28658d" stroke-width="4"/><circle cx="68" cy="66" r="36" fill="#e2eef6"/><text x="68" y="76" fill="#28658d" font-size="31" font-weight="700">2</text><text x="68" y="137" fill="#153d47" font-size="22" font-weight="700">座標範圍</text><path d="M29 186H106V245H29Z" fill="#e2eef6" stroke="#28658d" stroke-width="4"/><path d="M29 218H106M68 186V245" stroke="#28658d" stroke-width="3"/></g>
    <g transform="translate(635 162)"><rect width="135" height="278" rx="10" fill="#fff" stroke="#b86217" stroke-width="4"/><circle cx="68" cy="66" r="36" fill="#fff0d7"/><text x="68" y="76" fill="#b86217" font-size="31" font-weight="700">3</text><text x="68" y="137" fill="#153d47" font-size="22" font-weight="700">圖徵格網</text><circle cx="43" cy="207" r="11" fill="#b86217"/><circle cx="68" cy="230" r="11" fill="#b86217"/><circle cx="94" cy="195" r="11" fill="#b86217"/><path d="M43 207L68 230L94 195" stroke="#b86217" stroke-width="4"/></g>
    <g transform="translate(788 162)"><rect width="135" height="278" rx="10" fill="#fff" stroke="#6b7f84" stroke-width="4"/><circle cx="68" cy="66" r="36" fill="#e8eeee"/><text x="68" y="76" fill="#556b71" font-size="31" font-weight="700">4</text><text x="68" y="137" fill="#153d47" font-size="22" font-weight="700">時間基準</text><circle cx="68" cy="216" r="39" fill="none" stroke="#556b71" stroke-width="5"/><path d="M68 216V190M68 216L91 229" stroke="#556b71" stroke-width="6" stroke-linecap="round"/></g>
    <g transform="translate(941 162)"><rect width="135" height="278" rx="10" fill="#fff" stroke="#37764c" stroke-width="4"/><circle cx="68" cy="66" r="36" fill="#e2efe5"/><text x="68" y="76" fill="#37764c" font-size="31" font-weight="700">5</text><text x="68" y="137" fill="#153d47" font-size="22" font-weight="700">已知點</text><path d="M68 178C38 178 28 198 28 215C28 246 68 267 68 267C68 267 108 246 108 215C108 198 98 178 68 178Z" fill="#e2efe5" stroke="#37764c" stroke-width="4"/><circle cx="68" cy="214" r="12" fill="#37764c"/></g>
  </g>
  <path d="M1083 294H1120" stroke="#28658d" stroke-width="7" marker-end="url(#a)"/>
  <g transform="translate(1024 477)"><circle cx="60" cy="60" r="52" fill="#153d47"/><path d="M32 60L52 80L91 38" fill="none" stroke="#8bd8cc" stroke-width="11" stroke-linecap="round"/><text x="60" y="132" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22" font-weight="700">全批驗證</text></g>
  <rect x="180" y="558" width="750" height="70" rx="9" fill="#153d47"/>
  <text x="555" y="589" text-anchor="middle" fill="#8bd8cc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="21" font-weight="700">順序很重要</text>
  <text x="555" y="616" text-anchor="middle" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="21">避免在錯誤座標、單位或基準上做大量運算</text>
</svg>
