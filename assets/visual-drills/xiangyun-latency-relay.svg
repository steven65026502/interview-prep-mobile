<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">API 效能像一場接力賽</title>
  <desc id="desc">總延遲由入口、資料庫、檢索、模型與外部服務每一棒相加，先量每棒的 p50 與 p95 才知道瓶頸。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">API 很慢，就像接力賽變慢：先量每一棒</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">總時間只是結果；入口、資料庫、檢索、模型與外部服務都可能拖慢</text>
  <path d="M70 425H1130" stroke="#b9ccc5" stroke-width="16" stroke-linecap="round"/>
  <g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(86 184)"><rect width="182" height="215" rx="12" fill="#fff" stroke="#1b6f73" stroke-width="4"/><circle cx="91" cy="63" r="37" fill="#dceee9"/><path d="M67 63H115M91 39V87" stroke="#1b6f73" stroke-width="7"/><text x="91" y="126" fill="#153d47" font-size="23" font-weight="700">入口</text><text x="91" y="160" fill="#597078" font-size="18">驗證／排隊</text><text x="91" y="195" fill="#1b6f73" font-size="22" font-weight="700">40 ms</text></g>
    <g transform="translate(295 184)"><rect width="182" height="215" rx="12" fill="#fff" stroke="#28658d" stroke-width="4"/><ellipse cx="91" cy="44" rx="46" ry="18" fill="#e2eef6" stroke="#28658d" stroke-width="4"/><path d="M45 44V91C45 101 66 109 91 109C116 109 137 101 137 91V44" fill="#eef6fb" stroke="#28658d" stroke-width="4"/><text x="91" y="143" fill="#153d47" font-size="23" font-weight="700">資料庫</text><text x="91" y="177" fill="#597078" font-size="18">JOIN／索引</text><text x="91" y="205" fill="#28658d" font-size="22" font-weight="700">120 ms</text></g>
    <g transform="translate(504 184)"><rect width="182" height="215" rx="12" fill="#fff" stroke="#b86217" stroke-width="4"/><circle cx="78" cy="65" r="37" fill="#fff0d7"/><circle cx="78" cy="65" r="21" fill="none" stroke="#b86217" stroke-width="6"/><path d="M104 91L130 117" stroke="#b86217" stroke-width="9"/><text x="91" y="143" fill="#153d47" font-size="23" font-weight="700">檢索</text><text x="91" y="177" fill="#597078" font-size="18">BM25／向量</text><text x="91" y="205" fill="#b86217" font-size="22" font-weight="700">180 ms</text></g>
    <g transform="translate(713 165)"><rect width="182" height="234" rx="12" fill="#fff" stroke="#9a4138" stroke-width="6"/><circle cx="91" cy="63" r="41" fill="#f8e6e2"/><circle cx="76" cy="58" r="6" fill="#9a4138"/><circle cx="106" cy="58" r="6" fill="#9a4138"/><path d="M72 82Q91 94 110 82" fill="none" stroke="#9a4138" stroke-width="5"/><text x="91" y="139" fill="#153d47" font-size="23" font-weight="700">模型</text><text x="91" y="173" fill="#597078" font-size="18">生成答案</text><text x="91" y="211" fill="#9a4138" font-size="27" font-weight="700">1,800 ms</text></g>
    <g transform="translate(922 184)"><rect width="182" height="215" rx="12" fill="#fff" stroke="#37764c" stroke-width="4"/><path d="M48 40H134V109H48Z" fill="#e2efe5" stroke="#37764c" stroke-width="4"/><path d="M65 61H117M65 84H107" stroke="#37764c" stroke-width="6"/><text x="91" y="143" fill="#153d47" font-size="23" font-weight="700">外部服務</text><text x="91" y="177" fill="#597078" font-size="18">API／網路</text><text x="91" y="205" fill="#37764c" font-size="22" font-weight="700">90 ms</text></g>
  </g>
  <g stroke="#28658d" stroke-width="7" marker-end="url(#a)"><path d="M270 292H289"/><path d="M479 292H498"/><path d="M688 292H707"/><path d="M897 292H916"/></g>
  <g transform="translate(339 488)"><rect width="522" height="118" rx="10" fill="#153d47"/><text x="261" y="35" text-anchor="middle" fill="#8bd8cc" font-family="Consolas,monospace" font-size="20">p50 = typical　p95 = slow tail</text><text x="261" y="69" text-anchor="middle" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22" font-weight="700">先確認慢在哪一棒，再決定要不要加索引、快取或換模型</text><text x="261" y="99" text-anchor="middle" fill="#cfe5df" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="19">不要一開口就說「加 Redis」</text></g>
</svg>
