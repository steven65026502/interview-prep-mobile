<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI 是電動工具，成果責任仍在人</title>
  <desc id="desc">AI 協助搜尋、產生草稿與重複工作，人負責定義需求、查來源、測試、判斷限制與簽署交付。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">AI 像電動工具：能加速，但不會替你驗收</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">面試不要隱藏 AI；把「它幫了什麼」與「你負責什麼」說清楚</text>
  <g transform="translate(72 164)" filter="url(#s)">
    <rect width="430" height="344" rx="12" fill="#fff" stroke="#28658d" stroke-width="4"/>
    <circle cx="107" cy="92" r="57" fill="#e2eef6" stroke="#28658d" stroke-width="4"/><circle cx="88" cy="84" r="7" fill="#153d47"/><circle cx="126" cy="84" r="7" fill="#153d47"/><path d="M85 116H129" stroke="#153d47" stroke-width="6" stroke-linecap="round"/>
    <path d="M210 75H365V185H210Z" fill="#153d47"/>
    <path d="M234 106H341M234 135H322M234 164H350" stroke="#8bd8cc" stroke-width="8" stroke-linecap="round"/>
    <path d="M157 105H199" stroke="#28658d" stroke-width="8" marker-end="url(#a)"/>
    <text x="215" y="239" fill="#28658d" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="27" font-weight="700">AI 加速</text>
    <text x="215" y="278" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22">搜尋 · 草稿 · 重複工作</text>
    <text x="215" y="312" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="19">像電鑽幫你更快完成加工</text>
  </g>
  <path d="M515 336H682" stroke="#28658d" stroke-width="9" marker-end="url(#a)"/>
  <g transform="translate(700 164)" filter="url(#s)">
    <rect width="430" height="344" rx="12" fill="#fff" stroke="#37764c" stroke-width="4"/>
    <circle cx="106" cy="87" r="47" fill="#f5c8bf" stroke="#9a4138" stroke-width="4"/>
    <path d="M52 212C63 145 78 131 106 131C134 131 149 145 160 212Z" fill="#e2efe5" stroke="#37764c" stroke-width="4"/>
    <g transform="translate(196 48)"><rect width="174" height="167" rx="9" fill="#e2efe5" stroke="#37764c" stroke-width="4"/><path d="M27 42H147M27 75H147M27 108H109" stroke="#37764c" stroke-width="8" stroke-linecap="round"/><path d="M99 137L118 154L151 116" fill="none" stroke="#9a4138" stroke-width="8"/></g>
    <text x="215" y="248" fill="#37764c" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="27" font-weight="700">我負責</text>
    <text x="215" y="285" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22">需求 · 來源 · 測試 · 限制</text>
    <text x="215" y="317" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="19">結果能不能交付，由我驗證</text>
  </g>
  <rect x="236" y="555" width="728" height="68" rx="9" fill="#153d47"/>
  <text x="600" y="597" text-anchor="middle" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="24" font-weight="700">最有說服力的證據：你能解釋取捨、失敗案例與驗證方法</text>
</svg>
