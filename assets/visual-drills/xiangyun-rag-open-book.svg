<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAG 像一場可以翻資料的考試</title>
  <desc id="desc">使用者問題先到文件櫃找出相關資料，再交給模型整理成附來源答案；微調則像事先練習答題習慣，不會自動帶入最新文件。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">RAG 就像「可以翻資料的考試」</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">先找證據，再回答；答案不是只靠模型記憶</text>
  <g transform="translate(55 173)" filter="url(#s)">
    <rect width="235" height="325" rx="12" fill="#fff" stroke="#153d47" stroke-width="4"/>
    <circle cx="118" cy="76" r="43" fill="#f5c8bf" stroke="#9a4138" stroke-width="4"/>
    <path d="M62 207C70 145 90 128 118 128C146 128 166 145 174 207Z" fill="#e2eef6" stroke="#28658d" stroke-width="4"/>
    <rect x="33" y="231" width="169" height="58" rx="8" fill="#fff0d7"/>
    <text x="118" y="267" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="20" font-weight="700">「怎麼降低幻覺？」</text>
    <text x="118" y="361" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23" font-weight="700">使用者提問</text>
  </g>
  <path d="M302 330H360" stroke="#28658d" stroke-width="8" marker-end="url(#a)"/>
  <g transform="translate(380 153)" filter="url(#s)">
    <rect width="250" height="365" rx="12" fill="#153d47"/>
    <text x="125" y="48" text-anchor="middle" fill="#8bd8cc" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="25" font-weight="700">文件櫃</text>
    <g>
      <rect x="30" y="76" width="52" height="220" fill="#f4bd58"/><rect x="88" y="102" width="52" height="194" fill="#8bd8cc"/><rect x="146" y="64" width="52" height="232" fill="#e2eef6"/><rect x="204" y="123" width="24" height="173" fill="#f5c8bf"/>
      <path d="M26 306H228" stroke="#fff" stroke-width="8"/>
    </g>
    <rect x="36" y="320" width="178" height="32" rx="6" fill="#fff"/>
    <text x="125" y="343" text-anchor="middle" fill="#153d47" font-family="Consolas,monospace" font-size="17">find relevant evidence</text>
  </g>
  <path d="M642 330H700" stroke="#28658d" stroke-width="8" marker-end="url(#a)"/>
  <g transform="translate(720 160)" filter="url(#s)">
    <rect width="185" height="350" rx="12" fill="#fff" stroke="#1b6f73" stroke-width="4"/>
    <circle cx="93" cy="97" r="57" fill="#dceee9" stroke="#1b6f73" stroke-width="4"/>
    <circle cx="73" cy="89" r="7" fill="#153d47"/><circle cx="113" cy="89" r="7" fill="#153d47"/><path d="M72 119Q93 135 114 119" fill="none" stroke="#153d47" stroke-width="5"/>
    <path d="M93 39V15M48 58L31 41M138 58L155 41" stroke="#1b6f73" stroke-width="7" stroke-linecap="round"/>
    <rect x="24" y="182" width="137" height="104" rx="7" fill="#e2eef6"/>
    <path d="M43 209H142M43 235H132M43 261H112" stroke="#28658d" stroke-width="8" stroke-linecap="round"/>
    <text x="93" y="326" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="22" font-weight="700">模型整理</text>
  </g>
  <path d="M917 330H974" stroke="#28658d" stroke-width="8" marker-end="url(#a)"/>
  <g transform="translate(990 183)" filter="url(#s)">
    <rect width="155" height="294" rx="12" fill="#fff" stroke="#37764c" stroke-width="4"/>
    <path d="M24 28H131V197H24Z" fill="#e2efe5" stroke="#37764c" stroke-width="3"/>
    <path d="M43 58H113M43 90H113M43 122H103" stroke="#37764c" stroke-width="8" stroke-linecap="round"/>
    <rect x="43" y="151" width="70" height="26" rx="5" fill="#37764c"/><text x="78" y="170" text-anchor="middle" fill="#fff" font-family="Consolas,monospace" font-size="15">[1] [2]</text>
    <text x="78" y="239" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="21" font-weight="700">附來源答案</text>
  </g>
  <rect x="180" y="560" width="840" height="66" rx="9" fill="#153d47"/>
  <text x="600" y="601" text-anchor="middle" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="24" font-weight="700">RAG 改的是「回答前拿到什麼資料」；Fine-tuning 改的是「模型平常怎麼答」</text>
</svg>
