<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">降低幻覺需要五道防線</title>
  <desc id="desc">資料來源、檢索、回答、工具動作與固定評測像五道閘門，任何一層不足都可能讓沒有證據的答案通過。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">降低幻覺，不是只跟模型說「不要亂講」</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">像機場安檢：五道防線一起工作，錯誤才不容易穿過去</text>
  <path d="M80 345H1120" stroke="#b9ccc5" stroke-width="18" stroke-linecap="round"/>
  <g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(104 186)"><path d="M0 0H158V300H0Z" fill="#fff" stroke="#1b6f73" stroke-width="4"/><path d="M31 0V300M127 0V300" stroke="#1b6f73" stroke-width="10"/><circle cx="79" cy="93" r="40" fill="#dceee9"/><path d="M57 94L73 110L104 77" fill="none" stroke="#1b6f73" stroke-width="9"/><text x="79" y="174" fill="#153d47" font-size="23" font-weight="700">資料</text><text x="79" y="207" fill="#597078" font-size="17">可信來源</text></g>
    <g transform="translate(317 186)"><path d="M0 0H158V300H0Z" fill="#fff" stroke="#28658d" stroke-width="4"/><path d="M31 0V300M127 0V300" stroke="#28658d" stroke-width="10"/><circle cx="79" cy="93" r="40" fill="#e2eef6"/><path d="M52 85H105M52 104H94" stroke="#28658d" stroke-width="8" stroke-linecap="round"/><text x="79" y="174" fill="#153d47" font-size="23" font-weight="700">檢索</text><text x="79" y="207" fill="#597078" font-size="17">真的找得到</text></g>
    <g transform="translate(530 186)"><path d="M0 0H158V300H0Z" fill="#fff" stroke="#b86217" stroke-width="4"/><path d="M31 0V300M127 0V300" stroke="#b86217" stroke-width="10"/><circle cx="79" cy="93" r="40" fill="#fff0d7"/><path d="M51 76H107V112H68L53 127V112H51Z" fill="#fff" stroke="#b86217" stroke-width="4"/><text x="79" y="174" fill="#153d47" font-size="23" font-weight="700">回答</text><text x="79" y="207" fill="#597078" font-size="17">引用或拒答</text></g>
    <g transform="translate(743 186)"><path d="M0 0H158V300H0Z" fill="#fff" stroke="#9a4138" stroke-width="4"/><path d="M31 0V300M127 0V300" stroke="#9a4138" stroke-width="10"/><circle cx="79" cy="93" r="40" fill="#f8e6e2"/><path d="M79 59V105M58 82H100" stroke="#9a4138" stroke-width="9"/><text x="79" y="174" fill="#153d47" font-size="23" font-weight="700">動作</text><text x="79" y="207" fill="#597078" font-size="17">人工確認</text></g>
    <g transform="translate(956 186)"><path d="M0 0H158V300H0Z" fill="#fff" stroke="#37764c" stroke-width="4"/><path d="M31 0V300M127 0V300" stroke="#37764c" stroke-width="10"/><circle cx="79" cy="93" r="40" fill="#e2efe5"/><path d="M52 95L70 113L106 72" fill="none" stroke="#37764c" stroke-width="9"/><text x="79" y="174" fill="#153d47" font-size="23" font-weight="700">評測</text><text x="79" y="207" fill="#597078" font-size="17">固定題庫</text></g>
  </g>
  <g transform="translate(57 520)"><rect width="1086" height="87" rx="10" fill="#153d47"/><circle cx="61" cy="44" r="25" fill="#9a4138"/><path d="M48 31L74 57M74 31L48 57" stroke="#fff" stroke-width="7"/><text x="108" y="37" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23" font-weight="700">沒有證據時，正確答案可以是「目前資料不足」</text><text x="108" y="66" fill="#cfe5df" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="19">拒答不是失敗；沒有證據卻講得很肯定才是風險</text></g>
</svg>
