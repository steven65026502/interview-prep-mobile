<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">設備告警從事件到結案的處理漏斗</title>
  <desc id="desc">大量重複設備事件先經格式驗證與去重，再依嚴重程度分級，通知值班人員並保留結案稽核。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#28658d"/></marker><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17343b" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="675" fill="#eef5f2"/>
  <text x="62" y="70" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="42" font-weight="700">告警不是一直寄信，而是一條可控的處置漏斗</text>
  <text x="63" y="111" fill="#597078" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23">同一事件只處理一次，重要事件才升級，最後必須留下原因與處置</text>

  <g transform="translate(70 165)" filter="url(#s)">
    <rect width="180" height="292" rx="10" fill="#fff" stroke="#1b6f73" stroke-width="4"/>
    <path d="M34 80H145V235H34Z" fill="#dceee9" stroke="#1b6f73" stroke-width="4"/>
    <circle cx="88" cy="112" r="22" fill="#9a4138"/><path d="M88 72V46M61 79L44 60M115 79L132 60" stroke="#9a4138" stroke-width="8" stroke-linecap="round"/>
    <text x="90" y="265" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="24" font-weight="700">設備事件</text>
  </g>
  <g font-family="Consolas,monospace" font-size="18" fill="#9a4138">
    <rect x="284" y="182" width="172" height="54" rx="7" fill="#f8e6e2" stroke="#9a4138" stroke-width="3"/><text x="303" y="216">E42 · 10:02:01</text>
    <rect x="284" y="254" width="172" height="54" rx="7" fill="#f8e6e2" stroke="#9a4138" stroke-width="3"/><text x="303" y="288">E42 · 10:02:02</text>
    <rect x="284" y="326" width="172" height="54" rx="7" fill="#f8e6e2" stroke="#9a4138" stroke-width="3"/><text x="303" y="360">E42 · 10:02:03</text>
  </g>
  <path d="M472 183H625L578 367H519Z" fill="#fff4dc" stroke="#b86217" stroke-width="5" filter="url(#s)"/>
  <text x="549" y="249" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23" font-weight="700">驗證</text>
  <text x="549" y="283" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23" font-weight="700">去重</text>
  <text x="549" y="317" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="23" font-weight="700">分級</text>
  <path d="M250 310H274M458 282H483M588 282H663" fill="none" stroke="#28658d" stroke-width="7" marker-end="url(#a)"/>
  <g transform="translate(680 175)" filter="url(#s)">
    <rect width="166" height="242" rx="14" fill="#fff" stroke="#28658d" stroke-width="4"/>
    <circle cx="83" cy="61" r="27" fill="#9a4138"/><circle cx="83" cy="121" r="27" fill="#f4bd58"/><circle cx="83" cy="181" r="27" fill="#47a585"/>
  </g>
  <g transform="translate(907 164)" filter="url(#s)">
    <rect width="208" height="270" rx="14" fill="#153d47"/>
    <rect x="24" y="35" width="160" height="92" rx="7" fill="#e2eef6"/>
    <path d="M45 92L74 67L100 81L133 51L165 72" fill="none" stroke="#28658d" stroke-width="6"/>
    <rect x="44" y="153" width="120" height="54" rx="8" fill="#ffd47e"/>
    <text x="104" y="187" text-anchor="middle" fill="#153d47" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="21" font-weight="700">通知值班</text>
    <path d="M57 236H151" stroke="#8bd8cc" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M850 292H895" fill="none" stroke="#28658d" stroke-width="7" marker-end="url(#a)"/>
  <g transform="translate(263 494)">
    <rect width="684" height="94" rx="10" fill="#153d47"/>
    <path d="M48 52L68 72L105 28" fill="none" stroke="#8bd8cc" stroke-width="9" stroke-linecap="round"/>
    <text x="139" y="48" fill="#fff" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="25" font-weight="700">結案不是按下已讀</text>
    <text x="139" y="76" fill="#cfe5df" font-family="Microsoft JhengHei,Noto Sans TC,sans-serif" font-size="20">保存原因、處置、影響時間與回歸測試結果</text>
  </g>
</svg>
